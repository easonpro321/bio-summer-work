<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biology Term Scavenger Hunt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@400;600&amp;family=Spectral:ital,wght@0,300;0,400;0,500;1,300&amp;display=swap" rel="stylesheet">
<style>
:root{
  --paper:#DCE3D5; --sheet:#FAFBF7; --ink:#1C2620; --ink-soft:#5D6A59;
  --ink-faint:#93A08D; --rule:#BCC7B3; --stamp:#6A4A87; --warn:#8C4A2F;
  --sheet-shadow:0 1px 0 #C6D0BD, 0 10px 22px -14px rgba(28,38,32,.5);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Spectral",Georgia,serif;font-weight:300;line-height:1.6}

button{font-family:"Archivo Narrow",Arial,sans-serif;font-size:.9rem;
  border:1px solid var(--rule);background:transparent;color:var(--ink-soft);
  border-radius:2px;padding:6px 12px;cursor:pointer}
button:hover{color:var(--ink);border-color:var(--ink-faint)}
button.primary{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
button.primary:hover{background:#2B3A31}
button:focus-visible,input:focus-visible,textarea:focus-visible,
.sheet:focus-visible{outline:2px solid var(--stamp);outline-offset:2px}

/* ---------- edit toolbar ---------- */
.tools{display:none;position:sticky;top:0;z-index:40;background:var(--paper);
  border-bottom:1px solid var(--rule);padding:12px 24px}
body.editing .tools{display:block}
.tools-in{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;
  align-items:center;gap:10px}
.tools .label{font-family:"Archivo Narrow",Arial,sans-serif;font-size:.95rem;
  flex:1;white-space:nowrap;color:var(--ink)}

.wrap{max-width:1180px;margin:0 auto;padding:0 24px}

/* ---------- masthead ---------- */
.masthead{padding:60px 0 26px;position:relative}
body.editing .masthead{padding-top:34px}
.masthead h1{font-size:clamp(1.9rem,5vw,3.3rem);font-weight:400;
  letter-spacing:-.015em;line-height:1.08;margin:0 0 6px;padding-right:90px}
.byline{font-family:"Archivo Narrow",Arial,sans-serif;font-size:.94rem;
  color:var(--ink-soft);margin:0}
.byline em{color:var(--ink);font-style:normal}
#editToggle{position:absolute;top:60px;right:0}
body.editing #editToggle{display:none}

.tally{display:flex;gap:3px;margin:28px 0 9px;height:22px;align-items:flex-end}
.tick{flex:1;background:var(--rule);height:9px;border-radius:1px}
.tick.filled{background:var(--stamp);height:22px}
.tick.part{background:#D8C9A8;height:15px}
.tally-note{font-family:"Archivo Narrow",Arial,sans-serif;font-size:.9rem;
  color:var(--ink-soft);margin:0}

/* ---------- filters ---------- */
.filters{display:flex;flex-wrap:wrap;gap:7px;
  border-top:1px solid var(--rule);padding-top:20px}
.filters button[aria-pressed="true"]{background:var(--ink);
  border-color:var(--ink);color:var(--sheet)}

/* ---------- notices ---------- */
.fail{margin:24px auto 0;max-width:74ch;padding:15px 18px;background:#F6E9E4;
  border:1px solid #D8B7A8;color:#6E3A24;font-size:.94rem;display:none}
.fail.show{display:block}
.fail code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.88em}

/* ---------- grid ---------- */
main{padding:30px 0 90px}
.unit-head{display:flex;align-items:baseline;gap:12px;margin:40px 0 15px}
.unit-head:first-child{margin-top:0}
.unit-head h2{font-size:1.24rem;font-weight:400;margin:0;white-space:nowrap}
.unit-head .line{flex:1;height:1px;background:var(--rule)}
.unit-head .n{font-family:"Archivo Narrow",Arial,sans-serif;font-size:.85rem;
  color:var(--ink-faint)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:19px}
.sheet{background:var(--sheet);border:1px solid #D3DBCB;box-shadow:var(--sheet-shadow);
  padding:10px 10px 0;display:flex;flex-direction:column;cursor:pointer;
  text-align:left;font:inherit;color:inherit;width:100%}
.sheet .frame{aspect-ratio:4/5;background:#EDF1E8;border:1px solid #E0E6D9;
  overflow:hidden;display:flex;align-items:center;justify-content:center}
.sheet .frame img{width:100%;height:100%;object-fit:cover;display:block}
.sheet .hint{font-size:.82rem;font-style:italic;color:var(--ink-faint);
  padding:13px;text-align:center;line-height:1.42}
.label{padding:10px 1px 12px}
.label .meta{display:flex;justify-content:space-between;
  font-family:"Archivo Narrow",Arial,sans-serif;font-size:.77rem;
  color:var(--ink-faint);margin-bottom:3px}
.label .acc{color:var(--stamp)}
.label .name{font-size:1.04rem;line-height:1.25}
.sheet.partial{border-color:#D8C9A8}
.sheet.empty{box-shadow:none;border-style:dashed;border-color:#C3CDBA;background:#F1F4ED}
.sheet.empty .name{color:var(--ink-faint)}
body:not(.editing) .sheet.empty{opacity:.75}

/* ---------- overlay ---------- */
.overlay{position:fixed;inset:0;background:rgba(24,33,27,.72);display:none;
  align-items:center;justify-content:center;padding:20px;z-index:60}
.overlay.open{display:flex}
.panel{background:var(--sheet);max-width:930px;width:100%;max-height:93vh;
  overflow:auto;padding:24px;position:relative;display:grid;gap:24px;
  grid-template-columns:minmax(0,1fr) minmax(0,1.05fr)}
.close{position:absolute;top:10px;right:12px;background:transparent;border:0;
  font-size:1.6rem;line-height:1;color:var(--ink-soft);cursor:pointer;padding:4px 8px}

.frame-lg{background:#EDF1E8;border:1px solid #E0E6D9;min-height:200px}
.frame-lg img{width:100%;display:block}

.drop{border:1px dashed var(--ink-faint);background:#EDF1E8;aspect-ratio:4/5;
  display:flex;align-items:center;justify-content:center;position:relative;
  cursor:pointer;overflow:hidden;text-align:center}
.drop.over{border-color:var(--stamp);background:#E6E2EE}
.drop img{width:100%;height:100%;object-fit:cover;display:block}
.drop .msg{padding:20px;font-size:.9rem;color:var(--ink-soft);font-style:italic}
.drop-actions{display:flex;gap:8px;margin-top:10px}

.acc-line{font-family:"Archivo Narrow",Arial,sans-serif;font-size:.82rem;
  color:var(--stamp);margin:0 0 2px}
.unit-line{font-family:"Archivo Narrow",Arial,sans-serif;font-size:.85rem;
  color:var(--ink-faint);margin:0 0 13px}
.panel h3{font-size:1.8rem;font-weight:400;margin:0 0 15px;line-height:1.15}
.panel p.caption{margin:0;font-size:1.02rem;max-width:60ch}
.panel p.todo{margin:0;color:var(--ink-faint);font-style:italic}
.hint-line{font-size:.88rem;font-style:italic;color:var(--ink-faint);margin:0 0 15px}

label.fld{display:block;font-family:"Archivo Narrow",Arial,sans-serif;
  font-size:.85rem;color:var(--ink-soft);margin:0 0 5px}
input[type=text],textarea{width:100%;font-family:"Spectral",Georgia,serif;
  font-weight:300;font-size:1rem;color:var(--ink);background:#fff;
  border:1px solid var(--rule);border-radius:2px;padding:9px 10px;line-height:1.55}
textarea{min-height:200px;resize:vertical}
.field{margin-bottom:15px}
.meter{font-family:"Archivo Narrow",Arial,sans-serif;font-size:.83rem;
  color:var(--ink-faint);margin-top:6px}
.meter.short{color:var(--warn)}
.meter.ok{color:var(--stamp)}
.panel-nav{display:flex;gap:8px;justify-content:space-between;
  border-top:1px solid var(--rule);padding-top:13px}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
  background:var(--ink);color:var(--sheet);padding:10px 18px;border-radius:2px;
  font-family:"Archivo Narrow",Arial,sans-serif;font-size:.9rem;opacity:0;
  pointer-events:none;transition:opacity .18s;z-index:90;max-width:90vw;text-align:center}
.toast.show{opacity:1}

@media (max-width:720px){
  .masthead{padding-top:36px}
  .masthead h1{padding-right:0}
  #editToggle{position:static;margin-top:14px}
  .panel{grid-template-columns:1fr;padding:18px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:13px}
  .tally{gap:2px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<style>.lottie-animation-container{width:var(--lottie-animation-container-width);height:var(--lottie-animation-container-height);background-color:var(--lottie-animation-container-background-color);overflow:hidden;margin:var(--lottie-animation-margin)}.lottie-animation-container svg{transform:scale(var(--lottie-animation-scale))}</style><style>.lottie-animation-container{width:var(--lottie-animation-container-width);height:var(--lottie-animation-container-height);background-color:var(--lottie-animation-container-background-color);overflow:hidden;margin:var(--lottie-animation-margin)}.lottie-animation-container svg{transform:scale(var(--lottie-animation-scale))}</style></head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
(function(){
"use strict";

var UNIT_NAMES={1:"Chemistry of Life",2:"Cell Structure and Function",
  3:"Cellular Energetics",4:"Cell Cycle",5:"Heredity",6:"Gene Expression",
  7:"Natural Selection",8:"Ecology"};

var KEY="apbio-v2";
var data=null, cur=-1, filter=0, editing=false;

/* ---------- data ---------- */

function baked(){
  return JSON.parse(document.getElementById("baked").textContent);
}

function load(){
  try{
    var raw=localStorage.getItem(KEY);
    if(raw){
      var p=JSON.parse(raw);
      if(p && p.terms && p.terms.length) return p;
    }
  }catch(e){}
  return baked();
}

var saveTimer=null, warned=false;
function save(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(function(){
    try{ localStorage.setItem(KEY,JSON.stringify(data)); warned=false; }
    catch(e){
      if(!warned){ warned=true;
        toast("Storage is full. Save a backup now, then remove a photo."); }
    }
  },250);
}

/* ---------- small helpers ---------- */

function acc(i){ return String(i+1).padStart(2,"0"); }
function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,""); }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function para(s){ return esc(s).replace(/\n{2,}/g,'</p><p class="caption">').replace(/\n/g,"<br>"); }
function sentences(s){ var m=s.trim().match(/[^.!?]+[.!?]+/g);
  return m?m.length:(s.trim()?1:0); }
function state(t){
  if(t.image && t.caption.trim()) return "done";
  if(t.image || t.caption.trim())  return "partial";
  return "empty";
}

function toast(msg){
  var el=document.getElementById("toast");
  el.textContent=msg; el.classList.add("show");
  clearTimeout(el._t);
  el._t=setTimeout(function(){ el.classList.remove("show"); },3400);
}

function fail(html){
  var el=document.getElementById("fail");
  el.innerHTML=html; el.classList.add("show");
}

function download(blob,name){
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=name;
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },5000);
}

function readImage(file,cb){
  var fr=new FileReader();
  fr.onload=function(){
    var im=new Image();
    im.onload=function(){
      var max=1400,w=im.width,h=im.height;
      if(w>h&&w>max){ h=Math.round(h*max/w); w=max; }
      else if(h>=w&&h>max){ w=Math.round(w*max/h); h=max; }
      var c=document.createElement("canvas");
      c.width=w; c.height=h;
      c.getContext("2d").drawImage(im,0,0,w,h);
      cb(c.toDataURL("image/jpeg",0.82));
    };
    im.onerror=function(){ toast("That file could not be read as an image."); };
    im.src=fr.result;
  };
  fr.onerror=function(){ toast("Could not read that file."); };
  fr.readAsDataURL(file);
}

/* ---------- render ---------- */

function render(){
  document.getElementById("byline").innerHTML=
    "Collected by <em>"+esc(data.student)+"</em> &nbsp;·&nbsp; identifier in every frame: "+
    esc(data.identifier);

  var units=Object.keys(UNIT_NAMES).map(Number);
  var shown=units.filter(function(u){ return filter===0||filter===u; });

  document.getElementById("main").innerHTML=shown.map(function(u){
    var list=data.terms.map(function(t,i){ return {t:t,i:i}; })
                       .filter(function(x){ return x.t.unit===u; });
    if(!list.length) return "";
    var n=list.filter(function(x){ return state(x.t)==="done"; }).length;
    return '<section><div class="unit-head"><h2>'+UNIT_NAMES[u]+'</h2>'+
      '<span class="line"></span><span class="n">'+n+" / "+list.length+'</span></div>'+
      '<div class="grid">'+list.map(function(x){ return sheetHTML(x.t,x.i); }).join("")+
      '</div></section>';
  }).join("");

  var done=data.terms.filter(function(t){ return state(t)==="done"; }).length;
  document.getElementById("tally").innerHTML=data.terms.map(function(t){
    var s=state(t);
    return '<span class="tick'+(s==="done"?" filled":s==="partial"?" part":"")+'"></span>';
  }).join("");
  document.getElementById("tallyNote").textContent=done+" of "+data.terms.length+" mounted";
  document.getElementById("toolCount").textContent=done+" of "+data.terms.length+" finished";
}

function sheetHTML(t,i){
  var body=t.image
    ? '<img src="'+esc(t.image)+'" alt="'+esc(t.term)+'" loading="lazy">'
    : '<span class="hint">'+esc(t.hint||"not collected yet")+'</span>';
  return '<button type="button" class="sheet '+state(t)+'" data-i="'+i+'">'+
    '<span class="frame">'+body+'</span><span class="label">'+
    '<span class="meta"><span class="acc">'+acc(i)+'</span><span>Unit '+t.unit+'</span></span>'+
    '<span class="name">'+esc(t.term)+'</span></span></button>';
}

/* ---------- filters ---------- */

(function(){
  var units=[0].concat(Object.keys(UNIT_NAMES).map(Number));
  document.getElementById("filters").innerHTML=units.map(function(u){
    return '<button type="button" data-u="'+u+'" aria-pressed="'+(u===0)+'">'+
      (u===0?"All 50":"Unit "+u)+"</button>";
  }).join("");
  document.getElementById("filters").addEventListener("click",function(e){
    var b=e.target.closest("button");
    if(!b) return;
    filter=Number(b.dataset.u);
    [].forEach.call(this.querySelectorAll("button"),function(x){
      x.setAttribute("aria-pressed",Number(x.dataset.u)===filter);
    });
    render();
  });
})();

/* ---------- panel ---------- */

var overlay=document.getElementById("overlay");
var panel=document.getElementById("panel");
var filePick=document.getElementById("filePick");

document.getElementById("main").addEventListener("click",function(e){
  var s=e.target.closest(".sheet");
  if(s) openPanel(Number(s.dataset.i));
});

function openPanel(i){
  cur=i;
  var t=data.terms[i];
  var head='<button type="button" class="close" id="pClose" aria-label="Close">&times;</button>';
  var meta='<p class="acc-line">'+acc(i)+'</p>'+
           '<p class="unit-line">Unit '+t.unit+' · '+UNIT_NAMES[t.unit]+'</p>';

  if(!editing){
    panel.innerHTML=head+
      '<div class="frame-lg">'+(t.image?'<img src="'+esc(t.image)+'" alt="'+esc(t.term)+'">':'')+'</div>'+
      '<div>'+meta+'<h3>'+esc(t.term)+'</h3>'+
      (t.caption?'<p class="caption">'+para(t.caption)+'</p>'
                :'<p class="todo">Caption not written yet.'+
                 (t.hint?" Planned specimen: "+esc(t.hint)+".":"")+'</p>')+
      '</div>';
    overlay.classList.add("open");
    panel.querySelector("#pClose").onclick=closePanel;
    panel.querySelector("#pClose").focus();
    return;
  }

  panel.innerHTML=head+
    '<div><div class="drop" id="drop">'+
      (t.image?'<img src="'+esc(t.image)+'" alt="">'
             :'<span class="msg">Drop a photo here, or tap to choose one</span>')+
    '</div><div class="drop-actions">'+
      '<button type="button" id="pPick">Choose photo</button>'+
      (t.image?'<button type="button" id="pClear">Remove photo</button>':'')+
    '</div></div>'+
    '<div>'+meta+
      '<div class="field"><label class="fld" for="pTerm">Term</label>'+
        '<input type="text" id="pTerm" value="'+esc(t.term)+'"></div>'+
      (t.hint?'<p class="hint-line">Planned specimen: '+esc(t.hint)+'</p>':'')+
      '<div class="field"><label class="fld" for="pCap">Your caption</label>'+
        '<textarea id="pCap" placeholder="Five sentences, in your own words.">'+esc(t.caption)+'</textarea>'+
        '<div class="meter" id="pMeter"></div></div>'+
      '<div class="panel-nav">'+
        '<button type="button" id="pPrev">&larr; Previous</button>'+
        '<button type="button" id="pNext">Next &rarr;</button>'+
      '</div></div>';

  overlay.classList.add("open");
  wire();
  document.getElementById("pCap").focus();
}

function wire(){
  var t=data.terms[cur];
  document.getElementById("pClose").onclick=closePanel;
  document.getElementById("pPrev").onclick=function(){ step(-1); };
  document.getElementById("pNext").onclick=function(){ step(1); };

  var drop=document.getElementById("drop");
  drop.onclick=pick;
  document.getElementById("pPick").onclick=function(e){ e.stopPropagation(); pick(); };

  var clr=document.getElementById("pClear");
  if(clr) clr.onclick=function(e){
    e.stopPropagation(); t.image=""; save(); render(); openPanel(cur);
  };

  ["dragenter","dragover"].forEach(function(ev){
    drop.addEventListener(ev,function(e){ e.preventDefault(); drop.classList.add("over"); });
  });
  ["dragleave","drop"].forEach(function(ev){
    drop.addEventListener(ev,function(e){ e.preventDefault(); drop.classList.remove("over"); });
  });
  drop.addEventListener("drop",function(e){
    var f=e.dataTransfer.files && e.dataTransfer.files[0];
    if(f) takeFile(f);
  });

  var cap=document.getElementById("pCap");
  cap.oninput=function(){ t.caption=cap.value; meter(); save(); };
  var term=document.getElementById("pTerm");
  term.oninput=function(){ t.term=term.value; save(); };
  meter();
}

function meter(){
  var t=data.terms[cur], el=document.getElementById("pMeter");
  if(!el) return;
  var n=sentences(t.caption);
  var w=t.caption.trim()?t.caption.trim().split(/\s+/).length:0;
  el.textContent=n+(n===1?" sentence":" sentences")+" · "+w+" words";
  el.className="meter "+(n===0?"":n<5?"short":"ok");
}

function pick(){ filePick.value=""; filePick.click(); }
filePick.onchange=function(){
  var f=filePick.files && filePick.files[0];
  if(f) takeFile(f);
};

function takeFile(f){
  if(!/^image\//.test(f.type)){ toast("That is not an image file."); return; }
  readImage(f,function(url){
    data.terms[cur].image=url;
    save(); render(); openPanel(cur);
    toast("Photo added.");
  });
}

function step(d){
  var n=cur+d;
  if(n<0||n>=data.terms.length) return;
  openPanel(n);
}

function closePanel(){ overlay.classList.remove("open"); render(); }

overlay.addEventListener("click",function(e){ if(e.target===overlay) closePanel(); });
document.addEventListener("keydown",function(e){
  if(!overlay.classList.contains("open")) return;
  if(e.key==="Escape"){ closePanel(); return; }
  var typing=e.target.tagName==="TEXTAREA"||e.target.tagName==="INPUT";
  if(typing) return;
  if(e.key==="ArrowLeft")  step(-1);
  if(e.key==="ArrowRight") step(1);
});

/* ---------- mode ---------- */

function setEditing(on){
  editing=on;
  document.body.classList.toggle("editing",on);
  if(on) location.hash="edit";
  else if(location.hash==="#edit") history.replaceState(null,"",location.pathname+location.search);
  render();
}

document.getElementById("editToggle").onclick=function(){ setEditing(true); };
document.getElementById("btnDone").onclick=function(){ setEditing(false); };

/* ---------- toolbar ---------- */

document.getElementById("btnMeta").onclick=function(){
  var s=prompt("Your name:",data.student);
  if(s!==null&&s.trim()) data.student=s.trim();
  var d=prompt("Your identifier (the object in every photo):",data.identifier);
  if(d!==null&&d.trim()) data.identifier=d.trim();
  save(); render(); toast("Saved.");
};

document.getElementById("btnBackup").onclick=function(){
  download(new Blob([JSON.stringify(data)],{type:"application/json"}),
           "scavenger-hunt-backup.json");
  toast("Backup downloaded.");
};

document.getElementById("btnRestore").onclick=function(){
  document.getElementById("jsonPick").click();
};

document.getElementById("jsonPick").onchange=function(){
  var f=this.files&&this.files[0];
  if(!f) return;
  var fr=new FileReader();
  fr.onload=function(){
    try{
      var p=JSON.parse(fr.result);
      if(!p.terms||!p.terms.length) throw 0;
      data=p; save(); render(); toast("Backup loaded.");
    }catch(e){ toast("That file isn't a valid backup."); }
  };
  fr.readAsText(f);
};

/* ---------- export ---------- */

function buildPage(){
  var doc=document.documentElement.cloneNode(true);

  var out={student:data.student,identifier:data.identifier,terms:[]};
  data.terms.forEach(function(t,i){
    out.terms.push({
      unit:t.unit, term:t.term, hint:t.hint||"",
      image: t.image ? "images/"+acc(i)+"-"+(slug(t.term)||"specimen")+".jpg" : "",
      caption:t.caption
    });
  });

  doc.querySelector("#baked").textContent="\n"+JSON.stringify(out,null,2)+"\n";
  doc.querySelector("#main").innerHTML="";
  doc.querySelector("#panel").innerHTML="";
  doc.querySelector("#overlay").classList.remove("open");
  doc.querySelector("#fail").classList.remove("show");
  doc.querySelector("#fail").innerHTML="";
  doc.querySelector("#tally").innerHTML="";
  doc.querySelector("body").classList.remove("editing");

  return "<!DOCTYPE html>\n"+doc.outerHTML;
}

document.getElementById("btnExport").onclick=function(){
  var withPhotos=data.terms.filter(function(t){ return t.image; }).length;
  var page=buildPage();

  if(typeof JSZip==="undefined"){
    download(new Blob([page],{type:"text/html"}),"index.html");
    toast("Zip library blocked — downloaded index.html only. Photos need saving by hand.");
    return;
  }

  var zip=new JSZip();
  zip.file("index.html",page);
  var imgs=zip.folder("images");
  data.terms.forEach(function(t,i){
    if(!t.image||t.image.indexOf("data:")!==0) return;
    imgs.file(acc(i)+"-"+(slug(t.term)||"specimen")+".jpg",
              t.image.split(",")[1],{base64:true});
  });
  if(!withPhotos) imgs.file(".gitkeep","");

  zip.generateAsync({type:"blob"}).then(function(blob){
    download(blob,"apbio-site.zip");
    toast(withPhotos+" photo"+(withPhotos===1?"":"s")+" exported. Unzip, upload the contents.");
  }).catch(function(){
    toast("Export failed. Save a backup instead.");
  });
};

/* ---------- start ---------- */

function storageWorks(){
  try{ localStorage.setItem("__p__","1"); localStorage.removeItem("__p__"); return true; }
  catch(e){ return false; }
}

try{
  data=load();
  if(location.hash==="#edit") setEditing(true);
  else render();
  if(!storageWorks()){
    fail("<strong>This browser will not save your work.</strong> "+
         "You can type and add photos, but it is lost when the tab closes. "+
         "Turn off private browsing, or upload this file to GitHub and use the "+
         "<code>github.io</code> address instead.");
  }
}catch(e){
  fail("<strong>Something went wrong starting up.</strong><br>"+
       "Error: <code>"+esc(e.message||String(e))+"</code>");
}

})();
</script>
